name: Scrape Opportunities

on:
  workflow_dispatch:
  schedule:
    - cron: "0 11 * * *"

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install scraper dependencies
        run: python -m pip install -r scraper/requirements.txt

      - name: Run scraper
        run: python scraper/scraper.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_TABLE: opportunities

      - name: Configure git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"

      - name: Commit and push changes
        run: |
          if [[ -n $(git status -s) ]]; then
            git add scraper/output/ frontend/opportunity_searcher/public/data/opportunities.json
            git commit -m "chore: auto-update opportunities data from daily scrape"
            git push
          else
            echo "No changes detected, skipping commit"
          fi

      - name: Upload scraped data artifact
        uses: actions/upload-artifact@v4
        with:
          name: opportunity-data
          path: |
            scraper/output/
            frontend/opportunity_searcher/public/data/opportunities.json

