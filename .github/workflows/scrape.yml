name: Scrape Opportunities

on:
  workflow_dispatch:
  schedule:
    - cron: "0 11 * * *"

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install scraper dependencies
        run: python -m pip install -r scraper/requirements.txt

      - name: Install Ollama for AI page extraction
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama
        run: |
          ollama serve &
          sleep 10
          ollama pull llama3.2

      - name: Run scraper
        run: |
          if [[ -n "${SUPABASE_URL}" && -n "${SUPABASE_SERVICE_ROLE_KEY}" ]]; then
            python scraper/scraper.py --enable-llm --upload-supabase
          else
            python scraper/scraper.py --enable-llm
          fi
        env:
          OLLAMA_MODEL: llama3.2
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_TABLE: opportunities

      - name: Upload scraped data artifact
        uses: actions/upload-artifact@v4
        with:
          name: opportunity-data
          path: |
            scraper/output/
            frontend/opportunity_searcher/public/data/opportunities.json
